server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Redirections relatives : sinon Nginx ajoute son port interne (80) et casse l'accès depuis le port 8080
  absolute_redirect off;

  # Résolution DNS à l'exécution : Nginx démarre même si le backend n'est pas encore prêt
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Compression des textes (HTML, CSS, JS, JSON, SVG) : le bundle passe d'environ 700 Ko à 200 Ko sur le réseau.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

  # En-têtes de sécurité, communs à toutes les réponses (ils ne se cumulent pas avec un add_header par emplacement :
  # les emplacements qui ajoutent un en-tête n'en ont pas ici).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Documentation technique : dossier ./documentation du projet, monté en lecture seule
  location = /documentation {
    return 301 /documentation/;
  }

  location /documentation/ {
    alias /usr/share/nginx/documentation/;
    index index.html;
  }

  # API Express (même origine que le front => les cookies de session fonctionnent)
  location /api/ {
    set $backend http://backend:5000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fichiers versionnés par Vite (nom avec hachage) et polices : jamais modifiés, cache d'un an.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location /fonts/ {
    expires 1y;
    try_files $uri =404;
  }

  # Application React (routes gérées côté client). Le HTML n'est jamais gardé en cache, pour récupérer
  # tout de suite la nouvelle version après un déploiement.
  location / {
    expires -1;
    try_files $uri $uri.html $uri/ /index.html;
  }
}
