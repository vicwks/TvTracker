server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Redirections relatives : sinon Nginx ajoute son port interne (80) et casse l'accès depuis le port 8080
  absolute_redirect off;

  # Résolution DNS à l'exécution : Nginx démarre même si le backend n'est pas encore prêt
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Documentation technique : dossier ./documentation du projet, monté en lecture seule
  location = /documentation {
    return 301 /documentation/;
  }

  location /documentation/ {
    alias /usr/share/nginx/documentation/;
    index index.html;
  }

  # API Express (même origine que le front => les cookies de session fonctionnent)
  location /api/ {
    set $backend http://backend:5000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Application React (routes gérées côté client)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
