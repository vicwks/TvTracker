<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Tracker</title>
    <!-- Polices servies par le site lui-même (pas de requête vers Google) : préchargées pour le premier affichage. -->
    <link rel="preload" href="/fonts/Fraunces-400-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBM-Plex-Sans-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Liste des affiches du carrousel : téléchargée en parallèle du JavaScript. -->
    <link rel="preload" href="/api/public/posters" as="fetch" crossorigin />
    <!-- Affiches TMDB : connexion ouverte dès le départ. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  </head>
  <body class="bg-zinc-950 text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
